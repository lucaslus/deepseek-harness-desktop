<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="color-scheme" content="dark">
    <title>DeepSeek Harness</title>
    <style>
      :root { color-scheme: dark; background: #171717; }
      * { box-sizing: border-box; }
      body {
        min-height: 100vh;
        margin: 0;
        display: grid;
        place-items: center;
        background: #171717;
        color: #f5f5f5;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        -webkit-app-region: drag;
        user-select: none;
      }
      main { display: grid; justify-items: center; gap: 16px; transform: translateY(10px); }
      .mark {
        width: 42px;
        height: 42px;
        border: 3px solid rgba(255, 255, 255, .16);
        border-top-color: #4f8dff;
        border-radius: 50%;
        animation: spin .85s linear infinite;
      }
      h1 { margin: 0; font-size: 19px; font-weight: 600; letter-spacing: -.2px; }
      p { margin: 0; color: #a8a8ab; font-size: 14px; }
      @keyframes spin { to { transform: rotate(360deg); } }
      @media (prefers-reduced-motion: reduce) { .mark { animation: none; } }
    </style>
  </head>
  <body>
    <main>
      <div class="mark" aria-hidden="true"></div>
      <h1>DeepSeek Harness</h1>
      <p>Starting your local workspace…</p>
    </main>
  </body>
</html>
